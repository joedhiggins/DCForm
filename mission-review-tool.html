<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mission Review Tool</title>
<style>
  :root {
    --text-xs: clamp(0.7rem, 0.66rem + 0.2vw, 0.8rem);
    --text-sm: clamp(0.82rem, 0.78rem + 0.3vw, 0.95rem);
    --text-base: clamp(0.95rem, 0.9rem + 0.25vw, 1.05rem);
    --text-lg: clamp(1.05rem, 0.95rem + 0.6vw, 1.25rem);
    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
    --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
    --radius-sm: 0.375rem; --radius-md: 0.6rem; --radius-lg: 0.85rem; --radius-xl: 1.1rem; --radius-full: 9999px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.08); --shadow-md: 0 10px 24px rgba(0,0,0,.08);
    --transition: 160ms cubic-bezier(0.16,1,0.3,1);
  }
  :root, [data-theme="light"] {
    --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #ffffff;
    --color-surface-offset: #edeae5; --color-border: #d4d1ca; --color-divider: #dcd9d5;
    --color-text: #28251d; --color-text-muted: #6f6c66; --color-text-faint: #9a978f;
    --color-primary: #01696f; --color-primary-hover: #0c4e54; --color-primary-highlight: #d7ecea;
    --color-warning: #a05a1a; --color-warning-highlight: #f7e9db;
    --color-error: #a13544; --color-error-highlight: #f5e2e5;
    --color-success: #437a22; --color-success-highlight: #e1edd9;
  }
  [data-theme="dark"] {
    --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
    --color-surface-offset: #22211f; --color-border: #393836; --color-divider: #262523;
    --color-text: #cdccca; --color-text-muted: #9a9895; --color-text-faint: #6a6864;
    --color-primary: #4f98a3; --color-primary-hover: #227f8b; --color-primary-highlight: #223333;
    --color-warning: #bb653b; --color-warning-highlight: #3a2c22;
    --color-error: #d163a7; --color-error-highlight: #3a2530;
    --color-success: #6daa45; --color-success-highlight: #24301c;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
  body { font-size: var(--text-base); line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border:0; background:none; cursor:pointer; transition: background var(--transition), border-color var(--transition); }
  input, select, textarea { border:1px solid rgba(40,37,29,.14); border-radius: var(--radius-md); background: var(--color-surface-2); padding: 0.55rem 0.7rem; min-height: 40px; width: 100%; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .topbar { display:flex; align-items:center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
  .topbar h1 { font-size: var(--text-lg); margin:0; }
  .toprow { display:flex; gap: var(--space-2); flex-wrap: wrap; }
  .btn { min-height: 42px; border-radius: var(--radius-md); padding: 0.6rem 0.9rem; background: var(--color-surface-2); border: 1px solid rgba(40,37,29,.1); font-weight:600; font-size: var(--text-sm); box-shadow: var(--shadow-sm); white-space: nowrap; }
  .btn.primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }
  .btn.danger { background: var(--color-error); color: white; border-color: var(--color-error); }
  .btn.ghost { background: transparent; box-shadow: none; }
  .card { background: var(--color-surface); border: 1px solid rgba(40,37,29,.08); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: var(--space-4); }
  .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--space-3); }
  .field label { display:block; font-size: var(--text-xs); font-weight:700; margin-bottom: .3rem; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .03em; }
  select[multiple] { min-height: 90px; }
  .filterbar-actions { display:flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
  .summary-strip { display:flex; gap: var(--space-2); flex-wrap: wrap; font-size: var(--text-sm); color: var(--color-text-muted); }
  .pill { background: var(--color-surface-2); border: 1px solid rgba(40,37,29,.08); border-radius: var(--radius-full); padding: .25rem .6rem; }
  table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  thead th { text-align:left; font-size: var(--text-xs); text-transform: uppercase; letter-spacing:.03em; color: var(--color-text-muted); padding: .5rem .6rem; border-bottom: 1px solid var(--color-divider); position: sticky; top:0; background: var(--color-surface); cursor:pointer; white-space:nowrap; }
  tbody td { padding: .55rem .6rem; border-bottom: 1px solid var(--color-divider); vertical-align: top; }
  tbody tr:hover { background: var(--color-surface-offset); }
  .table-scroll { overflow-x: auto; max-height: 60vh; overflow-y: auto; border-radius: var(--radius-lg); border: 1px solid rgba(40,37,29,.08); }
  .badge { display:inline-block; padding: .15rem .45rem; border-radius: var(--radius-full); font-size: var(--text-xs); background: var(--color-surface-offset); color: var(--color-text-muted); margin-right: .2rem; }
  .badge.yes { background: var(--color-success-highlight); color: var(--color-success); }
  .badge.no { background: var(--color-error-highlight); color: var(--color-error); }
  .badge.na { background: var(--color-surface-offset); color: var(--color-text-faint); }
  .notes-cell { max-width: 260px; white-space: pre-wrap; }
  .empty { text-align:center; padding: var(--space-8); color: var(--color-text-muted); border: 1px dashed rgba(40,37,29,.14); border-radius: var(--radius-xl); }
  .filelist { display:flex; flex-direction:column; gap: var(--space-2); }
  .fileitem { display:flex; align-items:center; justify-content: space-between; gap: var(--space-2); padding: .5rem .7rem; background: var(--color-surface-2); border-radius: var(--radius-md); border: 1px solid rgba(40,37,29,.08); font-size: var(--text-sm); }
  .fileitem span.count { color: var(--color-text-muted); font-size: var(--text-xs); }
  .fileitem button { color: var(--color-error); font-weight:700; font-size: var(--text-xs); }
  #dropzone { border: 2px dashed rgba(40,37,29,.2); border-radius: var(--radius-xl); padding: var(--space-6); text-align:center; color: var(--color-text-muted); cursor:pointer; }
  #dropzone.dragover { background: var(--color-primary-highlight); border-color: var(--color-primary); color: var(--color-primary-hover); }
  .row-2 { display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  @media (max-width: 760px) { .row-2 { grid-template-columns: 1fr; } }
  .clearlink { font-size: var(--text-xs); color: var(--color-primary); text-decoration: underline; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Mission Review Tool</h1>
    <div class="toprow">
      <button class="btn primary" id="importBtn">Import JSON files</button>
      <button class="btn" id="exportAllJsonBtn">Export all (JSON)</button>
      <button class="btn" id="exportAllCsvBtn">Export all (CSV)</button>
      <button class="btn" id="exportFilteredJsonBtn">Export filtered (JSON)</button>
      <button class="btn" id="exportFilteredCsvBtn">Export filtered (CSV)</button>
      <button class="btn danger ghost" id="clearAllBtn">Clear all</button>
      <input type="file" id="fileInput" accept="application/json,.json" multiple class="hidden" style="display:none;" />
    </div>
  </div>

  <div class="card" id="dropzone">
    Drag JSON mission exports here, or use "Import JSON files" above.
  </div>

  <div class="card" id="filesCard" style="display:none;">
    <strong style="font-size: var(--text-sm);">Imported files</strong>
    <div class="filelist" id="fileList" style="margin-top: var(--space-2);"></div>
  </div>

  <div class="card" id="filtersCard" style="display:none;">
    <div class="filters" id="filtersGrid"></div>
    <div class="filterbar-actions">
      <span class="clearlink" id="clearFiltersBtn">Clear all filters</span>
    </div>
  </div>

  <div id="summaryStripWrap"></div>

  <div id="resultsWrap"></div>
</div>

<script>
const EVENT_TYPE_LABELS = {
  quick_note: 'Quick note', communication: 'Communication', geofence_alert: 'Geofence alert',
  route_point: 'Route point', tech_failure: 'Tech failure', observation: 'Observation / comment',
  pli_issue: 'PLI issues', route_pushed: 'Route pushed', mission_marker: 'Mission marker',
};

let missions = [];
let flatEvents = [];
let filters = { types: [], collectors: [], users: [], roles: [], alert: '', screenshot: '', trouble: '', search: '' };

const els = {
  fileInput: document.getElementById('fileInput'),
  importBtn: document.getElementById('importBtn'),
  dropzone: document.getElementById('dropzone'),
  filesCard: document.getElementById('filesCard'),
  fileList: document.getElementById('fileList'),
  filtersCard: document.getElementById('filtersCard'),
  filtersGrid: document.getElementById('filtersGrid'),
  summaryStripWrap: document.getElementById('summaryStripWrap'),
  resultsWrap: document.getElementById('resultsWrap'),
  clearFiltersBtn: document.getElementById('clearFiltersBtn'),
  clearAllBtn: document.getElementById('clearAllBtn'),
  exportAllJsonBtn: document.getElementById('exportAllJsonBtn'),
  exportAllCsvBtn: document.getElementById('exportAllCsvBtn'),
  exportFilteredJsonBtn: document.getElementById('exportFilteredJsonBtn'),
  exportFilteredCsvBtn: document.getElementById('exportFilteredCsvBtn'),
};

function handleFiles(fileArr) {
  fileArr.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !parsed.meta || !Array.isArray(parsed.events)) throw new Error('bad schema');
        if (missions.some(m => m.missionId === parsed.missionId && m.__sourceFile === file.name)) return;
        parsed.__sourceFile = file.name;
        missions.push(parsed);
        rebuild();
      } catch (err) {
        alert(`Could not import "${file.name}": not a valid mission export.`);
      }
    };
    reader.readAsText(file);
  });
}

function rebuild() {
  flatEvents = [];
  missions.forEach(m => {
    m.events.forEach(ev => {
      flatEvents.push({
        sourceFile: m.__sourceFile,
        missionId: m.missionId,
        dataCollector: m.meta.dataCollector || '',
        date: m.meta.date || '',
        team: m.meta.team || '',
        mission: m.meta.mission || '',
        teamNumber: m.meta.team || '',
        missionNumber: m.meta.mission || '',
        observedUser: m.meta.observedUser || '',
        role: m.meta.role || '',
        eventId: ev.id,
        type: ev.type,
        typeLabel: EVENT_TYPE_LABELS[ev.type] || ev.type,
        timestamp: ev.timestamp,
        alert: ev.alert,
        screenshot: !!ev.screenshot,
        troubleTicket: !!ev.troubleTicket,
        notes: ev.notes || '',
        details: ev.details || {},
      });
    });
  });
  flatEvents.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
  renderFileList();
  renderFilters();
  applyFiltersAndRender();
}

function renderFileList() {
  els.filesCard.style.display = missions.length ? 'block' : 'none';
  els.fileList.innerHTML = missions.map((m, idx) => `
    <div class="fileitem">
      <span>${escapeHtml(m.__sourceFile)} — ${escapeHtml(m.meta.dataCollector || 'Unknown')} (${escapeHtml(m.meta.observedUser || '—')}, ${escapeHtml(m.meta.role || '—')})
        <span class="count">${m.events.length} events</span>
      </span>
      <button data-remove="${idx}">Remove</button>
    </div>
  `).join('');
  els.fileList.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => {
    missions.splice(Number(btn.dataset.remove), 1);
    rebuild();
  }));
}

function uniqueSorted(arr) { return [...new Set(arr.filter(v => v !== '' && v != null))].sort(); }

function renderFilters() {
  els.filtersCard.style.display = flatEvents.length ? 'block' : 'none';
  if (!flatEvents.length) return;
  const types = uniqueSorted(flatEvents.map(e => e.type));
  const collectors = uniqueSorted(flatEvents.map(e => e.dataCollector));
  const users = uniqueSorted(flatEvents.map(e => e.observedUser));
  const roles = uniqueSorted(flatEvents.map(e => e.role));

  els.filtersGrid.innerHTML = `
    <div class="field"><label>Event type</label><select multiple id="filterType">${types.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(EVENT_TYPE_LABELS[t] || t)}</option>`).join('')}</select></div>
    <div class="field"><label>Data collector</label><select multiple id="filterCollector">${collectors.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('')}</select></div>
    <div class="field"><label>Observed user</label><select multiple id="filterUser">${users.map(u => `<option value="${escapeAttr(u)}">${escapeHtml(u)}</option>`).join('')}</select></div>
    <div class="field"><label>Role</label><select multiple id="filterRole">${roles.map(r => `<option value="${escapeAttr(r)}">${escapeHtml(r)}</option>`).join('')}</select></div>
    <div class="field"><label>Alert received</label><select id="filterAlert"><option value="">Any</option><option value="true">Yes</option><option value="false">No</option><option value="null">N/A</option></select></div>
    <div class="field"><label>Screenshot</label><select id="filterScreenshot"><option value="">Any</option><option value="true">Yes</option><option value="false">No</option></select></div>
    <div class="field"><label>Trouble ticket</label><select id="filterTrouble"><option value="">Any</option><option value="true">Yes</option><option value="false">No</option></select></div>
    <div class="field"><label>Search notes</label><input type="text" id="filterSearch" placeholder="Keyword..." /></div>
  `;

  document.getElementById('filterType').addEventListener('change', e => { filters.types = getMultiValues(e.target); applyFiltersAndRender(); });
  document.getElementById('filterCollector').addEventListener('change', e => { filters.collectors = getMultiValues(e.target); applyFiltersAndRender(); });
  document.getElementById('filterUser').addEventListener('change', e => { filters.users = getMultiValues(e.target); applyFiltersAndRender(); });
  document.getElementById('filterRole').addEventListener('change', e => { filters.roles = getMultiValues(e.target); applyFiltersAndRender(); });
  document.getElementById('filterAlert').addEventListener('change', e => { filters.alert = e.target.value; applyFiltersAndRender(); });
  document.getElementById('filterScreenshot').addEventListener('change', e => { filters.screenshot = e.target.value; applyFiltersAndRender(); });
  document.getElementById('filterTrouble').addEventListener('change', e => { filters.trouble = e.target.value; applyFiltersAndRender(); });
  document.getElementById('filterSearch').addEventListener('input', e => { filters.search = e.target.value.toLowerCase(); applyFiltersAndRender(); });
}

function getMultiValues(select) { return [...select.selectedOptions].map(o => o.value); }

function getFilteredEvents() {
  return flatEvents.filter(e => {
    if (filters.types.length && !filters.types.includes(e.type)) return false;
    if (filters.collectors.length && !filters.collectors.includes(e.dataCollector)) return false;
    if (filters.users.length && !filters.users.includes(e.observedUser)) return false;
    if (filters.roles.length && !filters.roles.includes(e.role)) return false;
    if (filters.alert !== '') {
      const want = filters.alert === 'null' ? null : filters.alert === 'true';
      if (e.alert !== want) return false;
    }
    if (filters.screenshot !== '') { if (e.screenshot !== (filters.screenshot === 'true')) return false; }
    if (filters.trouble !== '') { if (e.troubleTicket !== (filters.trouble === 'true')) return false; }
    if (filters.search) {
      const hay = (e.notes + ' ' + JSON.stringify(e.details)).toLowerCase();
      if (!hay.includes(filters.search)) return false;
    }
    return true;
  });
}

let sortState = { col: 'timestamp', dir: 1 };

function applyFiltersAndRender() {
  const filtered = getFilteredEvents();
  renderSummaryStrip(filtered);
  renderTable(filtered);
}

function renderSummaryStrip(filtered) {
  if (!flatEvents.length) { els.summaryStripWrap.innerHTML = ''; return; }
  els.summaryStripWrap.innerHTML = `
    <div class="summary-strip">
      <span class="pill">Missions: ${missions.length}</span>
      <span class="pill">Total events: ${flatEvents.length}</span>
      <span class="pill">Filtered: ${filtered.length}</span>
    </div>
  `;
}

function renderTable(filtered) {
  if (!flatEvents.length) {
    els.resultsWrap.innerHTML = `<div class="empty">Import mission JSON files to begin.</div>`;
    return;
  }
  if (!filtered.length) {
    els.resultsWrap.innerHTML = `<div class="empty">No events match the current filters.</div>`;
    return;
  }
  const sorted = [...filtered].sort((a,b) => {
    const av = a[sortState.col], bv = b[sortState.col];
    if (sortState.col === 'timestamp') return (new Date(av) - new Date(bv)) * sortState.dir;
    return String(av || '').localeCompare(String(bv || '')) * sortState.dir;
  });
  els.resultsWrap.innerHTML = `
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th data-sort="timestamp">Time</th>
            <th data-sort="typeLabel">Type</th>
            <th data-sort="dataCollector">Collector</th>
            <th data-sort="observedUser">User</th>
            <th data-sort="role">Role</th>
            <th>Alert</th>
            <th>Flags</th>
            <th>Details / Notes</th>
          </tr>
        </thead>
        <tbody>
          ${sorted.map(e => `
            <tr>
              <td>${escapeHtml(formatTime(e.timestamp))}</td>
              <td>${escapeHtml(e.typeLabel)}</td>
              <td>${escapeHtml(e.dataCollector)}</td>
              <td>${escapeHtml(e.observedUser)}</td>
              <td>${escapeHtml(e.role)}</td>
              <td>${alertBadge(e.alert)}</td>
              <td>${e.screenshot ? '<span class="badge">Screenshot</span>' : ''}${e.troubleTicket ? '<span class="badge">Ticket</span>' : ''}</td>
              <td class="notes-cell">${escapeHtml(buildDetailsLine(e))}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
  els.resultsWrap.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const col = th.dataset.sort;
    sortState.dir = sortState.col === col ? -sortState.dir : 1;
    sortState.col = col;
    applyFiltersAndRender();
  }));
}

function alertBadge(v) {
  if (v === true) return '<span class="badge yes">Yes</span>';
  if (v === false) return '<span class="badge no">No</span>';
  return '<span class="badge na">N/A</span>';
}

function buildDetailsLine(e) {
  const d = e.details || {};
  let line = '';
  switch (e.type) {
    case 'communication': line = [d.method, d.direction, d.initiator, d.recipients].filter(Boolean).join(' · '); break;
    case 'geofence_alert': line = d.geofence || ''; break;
    case 'route_point': line = d.routePoint || ''; break;
    case 'tech_failure': line = [d.category, d.impact].filter(Boolean).join(' · '); break;
    case 'pli_issue': line = d.status || ''; break;
    case 'route_pushed': line = [d.targetUser, d.destination].filter(Boolean).join(' → '); break;
    case 'mission_marker': line = d.kind || ''; break;
    default: line = '';
  }
  return [line, e.notes].filter(Boolean).join(' — ');
}

function formatTime(ts) { if (!ts) return '—'; try { const d = new Date(ts); return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`; } catch { return ts; } }

function exportJson(events, filename) { downloadBlob(JSON.stringify(events, null, 2), filename, 'application/json'); }
function exportCsv(events, filename) {
  const headers = ['sourceFile','missionId','dataCollector','date','teamNumber','missionNumber','observedUser','role','eventId','type','timestamp','alert','screenshot','troubleTicket','notes','detailsJson'];
  const rows = events.map(e => ({
    sourceFile: e.sourceFile, missionId: e.missionId, dataCollector: e.dataCollector, date: e.date,
    teamNumber: e.team, missionNumber: e.mission, observedUser: e.observedUser, role: e.role, eventId: e.eventId,
    type: e.typeLabel, timestamp: e.timestamp,
    alert: e.alert === true ? 'Y' : (e.alert === false ? 'N' : 'NA'),
    screenshot: e.screenshot ? 'Y' : 'N', troubleTicket: e.troubleTicket ? 'Y' : 'N',
    notes: e.notes, detailsJson: JSON.stringify(e.details),
  }));
  const csv = [headers.join(',')].concat(rows.map(r => headers.map(h => csvCell(r[h])).join(','))).join('\n');
  downloadBlob(csv, filename, 'text/csv;charset=utf-8');
}
function csvCell(v) { return `"${String(v ?? '').replace(/"/g,'""')}"`; }
function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

els.importBtn.addEventListener('click', () => els.fileInput.click());
els.fileInput.addEventListener('change', e => { handleFiles([...e.target.files]); e.target.value = ''; });
els.dropzone.addEventListener('click', () => els.fileInput.click());
els.dropzone.addEventListener('dragover', e => { e.preventDefault(); els.dropzone.classList.add('dragover'); });
els.dropzone.addEventListener('dragleave', () => els.dropzone.classList.remove('dragover'));
els.dropzone.addEventListener('drop', e => {
  e.preventDefault(); els.dropzone.classList.remove('dragover');
  handleFiles([...e.dataTransfer.files].filter(f => f.name.endsWith('.json')));
});
els.clearFiltersBtn.addEventListener('click', () => {
  filters = { types: [], collectors: [], users: [], roles: [], alert: '', screenshot: '', trouble: '', search: '' };
  renderFilters();
  applyFiltersAndRender();
});
els.clearAllBtn.addEventListener('click', () => {
  if (!confirm('Remove all imported files?')) return;
  missions = [];
  rebuild();
});
els.exportAllJsonBtn.addEventListener('click', () => exportJson(flatEvents, 'combined-events.json'));
els.exportAllCsvBtn.addEventListener('click', () => exportCsv(flatEvents, 'combined-events.csv'));
els.exportFilteredJsonBtn.addEventListener('click', () => exportJson(getFilteredEvents(), 'filtered-events.json'));
els.exportFilteredCsvBtn.addEventListener('click', () => exportCsv(getFilteredEvents(), 'filtered-events.csv'));

rebuild();
</script>
</body>
</html>
